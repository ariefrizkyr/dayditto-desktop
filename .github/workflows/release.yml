name: Release

# Push a `vX.Y.Z` tag (matching tauri.conf.json and Cargo.toml) to build, sign, notarize and
# publish a universal DMG plus the updater artifacts and latest.json to GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "v$app" != "$GITHUB_REF_NAME" ] || [ "$crate" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, tauri.conf.json $app and Cargo.toml $crate must match"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A manual run has no tag: the action fills __VERSION__ from tauri.conf.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: DayDitto ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Download the DMG below, or update from inside the app (DayDitto → Check for Updates…).
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin
